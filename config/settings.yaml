timezone: Africa/Lagos

llm:
  provider: bedrock
  # set to the Bedrock model/inference profile ID I have access to
  model_id: "us.anthropic.claude-sonnet-4-6"
  temperature: 0.2
  max_tokens: 1024
  # Transport resilience: fast connect fail + botocore-level retries with backoff
  # at the HTTP layer (before the agent-level retry in agent/runner.py).
  connect_timeout_seconds: 5
  read_timeout_seconds: 60
  max_attempts: 3
  retry_mode: standard   # standard | adaptive | legacy

embeddings:
  provider: titan
  model_id: amazon.titan-embed-text-v2:0
  dimensions: 1024
  normalize: true
  max_retries: 3
  backoff_seconds: 1.0
  request_timeout_seconds: 30

vectorstore:
  type: chroma
  path: data/runtime/chroma
  collection: rubies_policies

rag:
  docs_path: rag/docs
  chunking_mode: heading
  chunking:
    mode: heading
    max_words: 450
  ignore_prefixes: ["_"]
  chunks_path: data/generated/rag_chunks.jsonl
  top_k: 4
  # calibrated from eval/reports/rag_calibration.json: lowest in-scope top-1 0.4924,
  # highest clearly off-topic 0.1335; in-domain unanswerable questions can
  # score about 0.516 and are NOT separable by threshold.
  similarity_threshold: 0.35
  max_failed_retrievals: 2
  max_query_chars: 1000
  no_result_message: "No relevant policy information was found. Do not guess. Tell the customer you do not know and offer a human handoff."
  # Pidgin / messy customer messages are rewritten to plain English by a small
  # separate LLM call before retrieval. Config picks the implementation.
  query_rewrite:
    enabled: true
    implementation: "llm"
    model_id: null            # null = use llm.model_id
    prompt_path: prompts/query_rewrite.md
    max_input_chars: 1000
    max_output_chars: 200
    max_tokens: 128
    temperature: 0.0
    timeout_seconds: 45
    log_text: false           # true logs original/rewritten text (also debug)
  # Sweep used by the rewrite comparison report (eval/reports/pidgin_threshold_report.md).
  threshold_report:
    sweep_start: 0.30
    sweep_stop: 0.50
    sweep_step: 0.02

session:
  expiry_minutes: 15
  max_failed_verifications: 3

confirmation:
  max_turns: 2
  max_tokens: 8
  reject_digits: true
  filler_words: ["pls", "plz", "please", "abeg", "o", "oh", "sha", "sef", "thanks", "thank", "you", "ma", "sir"]
  affirmative_words: ["yes", "yeah", "yep", "yup", "confirm", "confirmed", "sure", "proceed", "correct", "definitely", "absolutely"]
  affirmative_phrases: ["go ahead", "do it", "do am", "block it", "block am", "dispute it", "confirm am", "na so", "i confirm"]
  negative_words: ["no", "not", "dont", "stop", "cancel", "wait", "abort", "nope", "never", "cant", "wont", "refuse", "decline", "hold", "later", "but", "if", "unless", "except", "instead", "only", "however", "cannot", "shouldnt", "didnt", "isnt", "wouldnt", "nah", "wrong", "mistake", "incorrect", "different", "another"]
  negative_phrases: ["no be", "no do", "no gree", "do not", "not now", "not yet", "hold on", "leave it", "forget it", "change am", "changed my mind"]

handoff:
  max_repeated_tool_errors: 3
  max_failed_retrievals: 2
  max_failed_verifications: 3

logging:
  tool_log_path: logs/tool_calls.jsonl
  debug: false
  redact_keys: [otp, token, session_token, authorization]
  mask_phone_keep_last: 4
  pending_token_prefix_chars: 4

adapter:
  type: cli
  host: 0.0.0.0        # kept for the future http_chat/Fleet adapter
  port: 8000

adapters:
  cli:
    allow_otp_command: true
    prompt_text: "You: "
    agent_label: "Rubies: "
  web:
    host: 127.0.0.1
    port: 8002
    cors_origins:
      - "http://localhost:3000"
    session_idle_seconds: 900
    session_max_age_seconds: 3600
    history_max_events: 400
    history_wait_seconds: 30
    clear_transcript_on_verification_expiry: true
    max_sessions: 50
    max_message_chars: 2000
    allow_dev_otp: false
    otp_log_path: logs/otp.log
    error_message: "Sorry, something went wrong. Please try again."
    stream_enabled: true
    heartbeat_seconds: 15
    max_stream_seconds: 120
    panel_summary_max_chars: 500

acceptance:
  max_attempts_per_scenario: 2

agent:
  system_prompt_path: prompts/system_prompt.md
  pidgin_examples_path: prompts/pidgin_examples.md
  max_history_messages: 40
  tool_timeout_seconds: 15
  bank_api_timeout_seconds: 10
  max_tool_calls_per_turn: 8
  fallback_message: "Sorry, something went wrong on my side. Please try again, or ask for a human agent and I will pass you over."
  # Connection/timeout failures from the model endpoint: retry this many extra
  # times (only when nothing has been streamed yet), then use the network message.
  model_retries: 2
  retry_backoff_seconds: 1.0
  network_error_message: "I can't reach our systems right now. Please try again in a moment."

seed:
  random_seed: 42
  customer_count: 20
  history_days: 90

startup:
  require_components: false  # when false, unbuilt components are reported; set true once all providers exist

bank_api:
  db_path: data/runtime/bank.db
  store_type: sqlite
  gateway: http
  otp_length: 6
  otp_ttl_seconds: 300
  otp_max_attempts: 3
  otp_delivery: mock
  otp_log_path: logs/otp.log
  phone_pattern: '^\+234[789]\d{9}$'
  pending_action_ttl_seconds: 300
  mini_statement_max_n: 50
  mini_statement_default_n: 10
  eligibility:
    min_account_age_days: 30
    min_avg_monthly_inflow_naira: 100000
    max_loan_to_inflow_multiple: 3
    kyc_tiers_allowed: [tier1, tier2, tier3]
    requested_amount_max_naira: 500000
  handoff_summary_max_chars: 1000
  handoff_reason_codes: [user_requested, upset_user, low_confidence, repeated_errors, failed_verification, other]
