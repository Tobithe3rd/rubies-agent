fictional_bank:
  name: Rubies Microfinance Bank
  transfer_fees_nip:
    up_to_5000_fee_naira: 10
    from_5001_to_50000_fee_naira: 25
    above_50000_fee_naira: 50
    vat_percent: 7.5
    above_50000_fee_with_vat_naira: 53.75
    to_rubies_account_fee_naira: 0
  other_fees_naira:
    sms_alert: 4
    debit_card_issuance: 1000
    card_replacement: 1500
    certified_statement: 1000
    mini_statement: 0
    balance_enquiry: 0
    savings_account_maintenance: 0
  loans:
    management_fee_percent_upfront: 1
    insurance_percent_upfront: 0.5
    tenor_months_min: 3
    tenor_months_max: 12
    products: [Quick Salary Loan, Small Business Loan]
    eligibility_note: "Eligibility thresholds come from section A (derived); never retyped here."
    loan_200k_example:
      requested_naira: 200000
      management_fee_naira: 2000
      insurance_naira: 1000
      total_upfront_naira: 3000
      requires:
        - "account age >= derived.eligibility_min_account_age_days days"
        - "average monthly inflow >= derived.eligibility_min_avg_monthly_inflow_naira naira"
        - "no existing active loan"
        - "KYC tier in derived.eligibility_kyc_tiers_allowed"
        - "requested amount <= derived.eligibility_requested_amount_max_naira naira"
        - "requested amount <= average monthly inflow * derived.eligibility_max_loan_to_inflow_multiple"
  dispute_timelines:
    acknowledge_hours: 24
    failed_or_double_debit_working_days: 5
    auto_reversal_of_failed_transfer_hours: 24
    loan_or_fee_days: 30
    general_complaint_days: 14
  escalation_levels:
    - level: L1
      description: "Chat agent ticket"
    - level: L2
      description: "Complaints Desk"
      email: complaints@rubiesmfb.example
      phone: "0700 000 0001"
    - level: L3
      description: "Head of Customer Experience"
      email: customercare.head@rubiesmfb.example
    - level: CBN
      description: "CBN Consumer Protection Department (after the timeline has passed without resolution)"
      email: cpd@cbn.gov.ng
  contact:
    ussd_code: "*000#"
    card_block_effective: "immediately after confirmation"
    domains: "fictional contact addresses use the .example domain only"
  never_ask:
    - full PIN
    - PIN
    - OTP
    - card CVV
    - full card number
    - password
    - BVN
    - NIN
  # Rubies limits are set equal to the CBN reference figures as reported by
  # secondary sources; single_transaction_limit equals the daily limit because
  # the framework states a daily cumulative limit.
  kyc_tiers:
    tier1:
      required_documents: "BVN or NIN"
      single_limit_naira: 50000
      daily_limit_naira: 50000
      max_balance_naira: 300000
    tier2:
      required_documents: "BVN and NIN"
      single_limit_naira: 200000
      daily_limit_naira: 200000
      max_balance_naira: 500000
    tier3:
      required_documents: "BVN and NIN, proof of address, source of funds"
      single_limit_naira: 5000000
      daily_limit_naira: 5000000
      max_balance_naira: "no limit"

real_rules:
  - id: cbn_how_to_lodge_complaints
    summary: "CBN explains how a consumer should lodge a complaint and escalate it, and the record-keeping a bank must keep."
    source_url: "https://www.cbn.gov.ng/FinInc/FinLit/How_Lodge_Complaints.pdf"
    date_read: 2026-10-27
    status: verified
    may_be_out_of_date: true
  - id: cbn_consumer_protection_regulations_2_0
    summary: "Revised CBN Consumer Protection Regulations covering complaint handling timelines and consumer redress."
    source_url: "https://www.cbn.gov.ng/Out/2024/CCD/EXPOSURE%20DRAFT%20REVISED%20CONSUMER%20PROTECTION%20REGULATIONS%202.0.pdf"
    date_read: 2026-10-27
    status: PENDING_USER_CONFIRMATION
    may_be_out_of_date: true
  - id: cbn_tiered_kyc_secondary
    summary: "Secondary explanation of CBN tiered KYC: tier names, documents and limits for low-value accounts."
    source_url: "https://youverify.co/blog/kyc-onboarding-nigeria-fintechs-cbn-guidelines"
    date_read: 2026-10-27
    status: PENDING_USER_CONFIRMATION
    may_be_out_of_date: true
  - id: cbn_guide_to_charges
    summary: "CBN Guide to Charges: the permitted fees banks may charge for transfers, cards, statements and alerts."
    source_url: PENDING_USER_CONFIRMATION
    date_read: 2026-10-27
    status: PENDING_USER_CONFIRMATION
    may_be_out_of_date: true
  - id: cbn_tiered_kyc_official
    summary: >-
      Tiered KYC figures taken from secondary sources that cite CBN circulars
      FPR/DIR/CIR/GEN/02/001 (18 Jan 2013) and BPS/DIR/GEN/CIR/04/007
      (11 Sep 2017). The tier limits are not confirmed against the official CBN
      text. Some sources report different Tier 1 and Tier 2 daily limits
      (NGN 30,000 and NGN 500,000); those figures were not used.
    source_url: "https://www.mypryme.com/blog/kyc-tier-limits-nigeria"
    date_read: 2026-10-27
    status: secondary_source_only
    may_be_out_of_date: true

