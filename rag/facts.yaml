# Rubies policy facts: single source of truth for the RAG documents.
# Do not retype numbers by hand. `derived` values are read from
# config/settings.yaml and the seeded DB; the checker verifies them live.
# Every real-world rule may be out of date; see rag/sources.md.

derived:
  # --- eligibility thresholds (config:bank_api.eligibility) ---
  eligibility_min_account_age_days:
    value: 30
    source: "config:bank_api.eligibility.min_account_age_days"
  eligibility_min_avg_monthly_inflow_naira:
    value: 100000
    source: "config:bank_api.eligibility.min_avg_monthly_inflow_naira"
  eligibility_max_loan_to_inflow_multiple:
    value: 3
    source: "config:bank_api.eligibility.max_loan_to_inflow_multiple"
  eligibility_kyc_tiers_allowed:
    value: [tier1, tier2, tier3]
    source: "config:bank_api.eligibility.kyc_tiers_allowed"
  eligibility_requested_amount_max_naira:
    value: 500000
    source: "config:bank_api.eligibility.requested_amount_max_naira"

  # --- session and OTP ---
  session_expiry_minutes:
    value: 15
    source: "config:session.expiry_minutes"
  session_max_failed_verifications:
    value: 3
    source: "config:session.max_failed_verifications"
  otp_length:
    value: 6
    source: "config:bank_api.otp_length"
  otp_ttl_seconds:
    value: 300
    source: "config:bank_api.otp_ttl_seconds"
  otp_max_attempts:
    value: 3
    source: "config:bank_api.otp_max_attempts"

  # --- pending actions and statements ---
  pending_action_ttl_seconds:
    value: 300
    source: "config:bank_api.pending_action_ttl_seconds"
  mini_statement_default_n:
    value: 10
    source: "config:bank_api.mini_statement_default_n"
  mini_statement_max_n:
    value: 50
    source: "config:bank_api.mini_statement_max_n"

  # --- handoff limits ---
  handoff_max_repeated_tool_errors:
    value: 3
    source: "config:handoff.max_repeated_tool_errors"
  handoff_summary_max_chars:
    value: 1000
    source: "config:bank_api.handoff_summary_max_chars"
  handoff_reason_codes:
    value: [user_requested, upset_user, low_confidence, repeated_errors, failed_verification, other]
    source: "config:bank_api.handoff_reason_codes"

  # --- KYC tier of each seeded customer (read from the DB) ---
  kyc_tiers_by_customer:
    value: {1: tier3, 2: tier1, 3: tier1, 4: tier2, 5: tier1, 6: tier1, 7: tier2, 8: tier1, 9: tier2, 10: tier3, 11: tier3, 12: tier1, 13: tier1, 14: tier2, 15: tier3, 16: tier1, 17: tier1, 18: tier3, 19: tier1, 20: tier2}
    source: "db:accounts.kyc_tier"

